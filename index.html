<style>
  :root {
    --bg: #080c14;
    --surface: #0d1520;
    --surface2: #121d2e;
    --surface3: #1a2740;
    --border: #1e3050;
    --border2: #253d60;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --accent4: #f59e0b;
    --accent5: #ef4444;
    --text: #e8f4ff;
    --text2: #8ba8c8;
    --text3: #4a6d94;
    --positive: #10b981;
    --negative: #ef4444;
    --warning: #f59e0b;
    --font: 'Syne', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  
  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .header-logo span { color: var(--text2); font-weight: 400; font-size: 12px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-badge { background: var(--accent2); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px; }
  
  /* FILTER BAR */
  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 52px; z-index: 99; }
  .filter-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .filter-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all .15s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: rgba(0,229,255,.1); border-color: var(--accent); color: var(--accent); }
  .filter-chip .chip-arrow { font-size: 9px; opacity: .5; }
  .filter-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .filter-reset { font-size: 11px; color: var(--text3); cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .filter-reset:hover { color: var(--accent5); }
  .compare-btn { background: rgba(124,58,237,.15); border: 1px solid var(--accent2); color: var(--accent2); border-radius: 6px; padding: 4px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
  
  /* NAV */
  .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 0; }
  .nav-tab { padding: 12px 20px; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap; }
  .nav-tab:hover { color: var(--text2); }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  
  /* MAIN CONTENT */
  .main { padding: 24px; display: flex; gap: 20px; position: relative; flex: 1; }
  .content-area { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  
  /* KPI ROW */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform .2s; transform-origin: left; }
  .kpi-card:hover::before { transform: scaleX(1); }
  .kpi-card:hover { border-color: var(--border2); background: var(--surface2); }
  .kpi-card.selected { border-color: var(--accent); background: rgba(0,229,255,.05); }
  .kpi-card.selected::before { transform: scaleX(1); }
  .kpi-name { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .kpi-value { font-size: 28px; font-weight: 800; color: var(--text); font-family: var(--mono); line-height: 1; }
  .kpi-delta { font-size: 11px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .kpi-delta.up { color: var(--positive); }
  .kpi-delta.down { color: var(--negative); }
  .kpi-delta.neutral { color: var(--text3); }
  .kpi-sub { font-size: 10px; color: var(--text3); margin-top: 4px; }
  .info-icon { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--text3); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text3); cursor: help; flex-shrink: 0; }
  
  /* SECTION */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .section-subtitle { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .section-body { padding: 20px; }
  .section-actions { display: flex; align-items: center; gap: 8px; }
  
  /* TOGGLE */
  .toggle-group { display: flex; background: var(--surface2); border-radius: 6px; padding: 2px; border: 1px solid var(--border); }
  .toggle-btn { padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--text3); cursor: pointer; border-radius: 4px; transition: all .15s; }
  .toggle-btn.active { background: var(--accent); color: var(--bg); }
  
  /* FUNNEL */
  .funnel-container { display: flex; flex-direction: column; gap: 4px; }
  .funnel-step { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 8px 10px; border-radius: 8px; transition: background .15s; }
  .funnel-step:hover { background: var(--surface2); }
  .funnel-step.selected { background: rgba(0,229,255,.07); }
  .funnel-bar-wrap { flex: 1; position: relative; height: 32px; display: flex; align-items: center; }
  .funnel-bar { height: 32px; border-radius: 4px; transition: width .5s ease; position: relative; display: flex; align-items: center; min-width: 40px; }
  .funnel-bar-label { position: absolute; left: 10px; font-size: 11px; font-weight: 700; color: white; white-space: nowrap; }
  .funnel-drop { font-size: 11px; font-weight: 600; color: var(--negative); min-width: 60px; text-align: right; }
  .funnel-step-name { font-size: 12px; color: var(--text2); min-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .funnel-step-cr { font-size: 13px; font-weight: 700; color: var(--text); font-family: var(--mono); min-width: 52px; text-align: right; }
  .funnel-connector { display: flex; align-items: center; padding: 0 10px 0 212px; }
  .funnel-connector-line { flex: 1; height: 1px; background: var(--border); }
  .funnel-connector-drop { font-size: 10px; color: var(--text3); padding: 0 8px; }
  
  /* CHART WRAPPERS */
  .chart-wrap { width: 100%; }
  
  /* TABLE */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .data-table td { padding: 10px 12px; font-size: 12px; color: var(--text2); border-bottom: 1px solid rgba(30,48,80,.5); vertical-align: middle; }
  .data-table tr:hover td { background: rgba(255,255,255,.02); cursor: pointer; }
  .data-table tr.selected td { background: rgba(0,229,255,.05); }
  .cell-mono { font-family: var(--mono); font-size: 12px; }
  .cell-name { color: var(--text); font-weight: 600; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .badge-green { background: rgba(16,185,129,.15); color: var(--positive); }
  .badge-red { background: rgba(239,68,68,.15); color: var(--negative); }
  .badge-yellow { background: rgba(245,158,11,.15); color: var(--warning); }
  .badge-blue { background: rgba(0,229,255,.15); color: var(--accent); }
  .badge-purple { background: rgba(124,58,237,.15); color: var(--accent2); }
  
  /* MINI BAR */
  .mini-bar-wrap { display: flex; align-items: center; gap: 6px; }
  .mini-bar { height: 6px; border-radius: 3px; background: var(--accent); }
  .mini-bar-val { font-family: var(--mono); font-size: 11px; color: var(--text2); }
  
  /* DRAWER */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; }
  .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 460px; background: var(--surface); border-left: 1px solid var(--border); z-index: 201; overflow-y: auto; transform: translateX(0); animation: slideIn .2s ease; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .drawer-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .drawer-title { font-size: 16px; font-weight: 800; color: var(--text); }
  .drawer-subtitle { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .drawer-close { font-size: 18px; color: var(--text3); cursor: pointer; padding: 4px; }
  .drawer-close:hover { color: var(--text); }
  .drawer-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .drawer-section { }
  .drawer-section-title { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .formula-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .def-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .def-item { background: var(--surface2); border-radius: 6px; padding: 10px; }
  .def-item-label { font-size: 10px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .def-item-val { font-size: 12px; color: var(--text2); }
  .insight-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .insight-item:last-child { border-bottom: none; }
  .insight-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .insight-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .hypothesis-item { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.3); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--text2); display: flex; gap: 8px; align-items: flex-start; }
  
  /* SCATTER */
  .scatter-wrap { position: relative; }
  .quadrant-label { position: absolute; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: .4; }
  
  /* HEATMAP */
  .heatmap-grid { display: grid; gap: 4px; }
  .heatmap-cell { border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--mono); cursor: pointer; transition: transform .1s; min-height: 36px; }
  .heatmap-cell:hover { transform: scale(1.05); }
  .heatmap-header { font-size: 10px; color: var(--text3); font-weight: 600; text-align: center; }
  .heatmap-row-label { font-size: 11px; color: var(--text2); display: flex; align-items: center; }
  
  /* TABS */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 18px; font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  
  /* GRID LAYOUTS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
  
  /* SANKEY placeholder */
  .path-flow { display: flex; flex-direction: column; gap: 8px; }
  .path-row { display: flex; align-items: center; gap: 10px; }
  .path-from { font-size: 11px; color: var(--text3); min-width: 120px; }
  .path-bars { flex: 1; display: flex; gap: 4px; align-items: center; }
  .path-segment { height: 20px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: rgba(255,255,255,.8); transition: width .4s ease; }
  .path-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .path-legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text3); }
  .path-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  
  /* ANOMALY */
  .anomaly-card { background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.2); border-radius: 8px; padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .anomaly-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--negative); flex-shrink: 0; margin-top: 4px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .anomaly-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .anomaly-badge { font-size: 10px; font-weight: 700; color: var(--negative); margin-top: 2px; }
  
  /* EMPTY STATE */
  .empty-state { padding: 40px 20px; text-align: center; color: var(--text3); font-size: 12px; }
  
  /* TOOLTIP */
  .tooltip-wrap { position: relative; display: inline-flex; }
  .tooltip-popup { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; width: 240px; z-index: 300; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .tooltip-wrap:hover .tooltip-popup { opacity: 1; }
  .tooltip-title { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .tooltip-formula { font-family: var(--mono); font-size: 11px; color: var(--text2); margin-bottom: 6px; background: var(--surface2); padding: 4px 8px; border-radius: 4px; }
  .tooltip-text { font-size: 10px; color: var(--text3); line-height: 1.5; }
  
  /* COLORS */
  .color-accent { color: var(--accent); }
  .color-green { color: var(--positive); }
  .color-red { color: var(--negative); }
  .color-yellow { color: var(--warning); }
  .color-purple { color: var(--accent2); }
  .color-dim { color: var(--text3); }
  
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  select, option { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: var(--font); outline: none; }
  select:focus { border-color: var(--accent); }
</style>
</head>

function FunnelChart({ steps, onStepClick, selectedStep }) {
  const maxCr = steps[0].cr;
  return (
    <div className="funnel-container">
      {steps.map((step, i) => {
        const width = (step.cr / maxCr) * 100;
        const drop = i > 0 ? (steps[i-1].cr - step.cr).toFixed(1) : null;
        const stepCR = i > 0 ? ((step.cr / steps[i-1].cr) * 100).toFixed(1) : '100';
        return (
          <div key={step.id}>
            {i > 0 && (
              <div className="funnel-connector">
                <div className="funnel-connector-line"/>
                <div className="funnel-connector-drop" style={{color:drop > 20 ? 'var(--negative)' : 'var(--text3)'}}>
                  −{drop}%
                </div>
                <div className="funnel-connector-line"/>
              </div>
            )}
            <div className={`funnel-step ${selectedStep === step.id ? 'selected' : ''}`}
              onClick={() => onStepClick && onStepClick(step)}>
              <div className="funnel-step-name">{step.label}</div>
              <div className="funnel-bar-wrap">
                <div className="funnel-bar" style={{width:`${width}%`, background: step.color, opacity: 0.85}}>
                  <span className="funnel-bar-label">{step.cr}%</span>
                </div>
              </div>
              <div className="funnel-step-cr" style={{color: step.color}}>{step.cr}%</div>
              {i > 0 && (
                <div className="funnel-drop">{stepCR}% CR</div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function HeatmapChart({ rows, cols, values, title }) {
  const allVals = values.flat();
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const getColor = (v) => {
    const t = (v - min) / (max - min);
    const r = Math.round(239 * (1-t) + 16 * t);
    const g = Math.round(68 * (1-t) + 185 * t);
    const b = Math.round(68 * (1-t) + 129 * t);
    return `rgba(${r},${g},${b},0.7)`;
  };
  return (
    <div>
      {title && <div style={{fontSize:11,color:'var(--text3)',marginBottom:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.8px'}}>{title}</div>}
      <div style={{display:'grid', gridTemplateColumns:`120px repeat(${cols.length}, 1fr)`, gap:4}}>
        <div/>
        {cols.map((c,i) => <div key={i} className="heatmap-header">{c}</div>)}
        {rows.map((row, ri) => (
          <>
            <div key={`r${ri}`} className="heatmap-row-label">{row}</div>
            {values[ri].map((v, ci) => (
              <div key={ci} className="heatmap-cell" style={{background:getColor(v)}}>{v}%</div>
            ))}
          </>
        ))}
      </div>
    </div>
  );
}

            </div>
          </div>
        </div>
      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-header">
            <div className="section-title">Error Distribution</div>
            <div className="section-subtitle">Частота vs Влияние на конверсию</div>
          </div>
          <div className="section-body">
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={ERROR_TYPES} barGap={4}>
                <XAxis dataKey="type" tick={{fill:'#8ba8c8',fontSize:10}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fill:'#4a6d94',fontSize:10}} axisLine={false} tickLine={false} tickFormatter={v=>`${v}%`}/>
                <Tooltip contentStyle={{background:'#0d1520',border:'1px solid #1e3050',borderRadius:8,fontSize:11}}/>
                <Bar dataKey="freq" name="Частота" fill={COLORS.accent4} radius={[4,4,0,0]}/>
                <Bar dataKey="impact" name="Impact на conv" fill={COLORS.accent5} radius={[4,4,0,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="section">
          <div className="section-header">
            <div className="section-title">Device × Method Heatmap (Success %)</div>
          </div>
          <div className="section-body">
            <HeatmapChart rows={HEATMAP_DEVICES} cols={HEATMAP_METHODS} values={HEATMAP_VALUES}/>
          </div>
        </div>
      </div>

      <div className="section">
        <div className="section-header">
          <div className="section-title">Путь после неуспешного депозита</div>
        </div>
        <div className="section-body">
          <PathFlow title="" paths={[
            {from:'Fail → действие', segments:[
              {label:'Retry same',pct:42},{label:'Switch method',pct:24},{label:'Support click',pct:12},{label:'Return later',pct:14},{label:'Exit',pct:8}
            ]}
          ]}/>
        </div>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
function App() {
  const [page, setPage] = useState(0);
  const [drawer, setDrawer] = useState(null);
  const [filters, setFilters] = useState({
    project: 'FL', period: '30 дней', device: 'Все', geo: 'Все гео', lifecycle: 'Все'
  });

  const pages = [
    { label: 'Core Journey', component: <Page1CoreJourney onDrawer={setDrawer}/> },
    { label: 'UX Features', component: <Page2UXFeatures onDrawer={setDrawer}/> },
    { label: 'Reg / Profile / KYC', component: <Page3RegProfile onDrawer={setDrawer}/> },
    { label: 'Bonuses / Store', component: <Page4Bonuses onDrawer={setDrawer}/> },
    { label: 'Game Discovery', component: <Page5GameDiscovery onDrawer={setDrawer}/> },
    { label: 'Deposit UX', component: <Page6Deposit onDrawer={setDrawer}/> },
  ];

  return (
    <div className="app">
      {/* Header */}
      <div className="header">
        <div className="header-logo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect width="8" height="8" rx="2" fill="#00e5ff"/>
            <rect x="12" width="8" height="8" rx="2" fill="#7c3aed"/>
            <rect y="12" width="8" height="8" rx="2" fill="#10b981"/>
            <rect x="12" y="12" width="8" height="8" rx="2" fill="#f59e0b" opacity=".6"/>
          </svg>
          FL Analytics
          <span>Product BI Dashboard · {filters.project}</span>
        </div>
        <div className="header-right">
          <div style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>
            {filters.period} · {filters.device} · {filters.geo}
          </div>
          <div className="header-badge">v2.0</div>
        </div>
      </div>

      {/* Filter Bar */}
      <FilterBar filters={filters} setFilters={setFilters}/>

      {/* Nav */}
      <div className="nav">
        {pages.map((p, i) => (
          <div key={i} className={`nav-tab ${page===i?'active':''}`} onClick={()=>setPage(i)}>
            {p.label}
          </div>
        ))}
      </div>

      {/* Main */}
      <div className="main">
        <div className="content-area">
          {pages[page].component}
        </div>
      </div>

      {/* Drawer */}
      {drawer && <DrawerOverlay item={drawer} onClose={()=>setDrawer(null)}/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
