<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FL продуктовый дашборд</title>
<style>
:root {
  --bg: #080c14;
  --surface: #0d1520;
  --surface-2: #121d2e;
  --surface-3: #18263a;
  --border: #1e3050;
  --border-2: #294266;
  --text: #e8f4ff;
  --text-2: #9ab3cf;
  --text-3: #6482a7;
  --accent: #00e5ff;
  --accent-2: #7c3aed;
  --accent-3: #10b981;
  --accent-4: #f59e0b;
  --accent-5: #ef4444;
  --shadow: 0 10px 24px rgba(0,0,0,.22);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
button, select { font: inherit; }
body { min-height: 100vh; }
#app { min-height: 100vh; }
.header {
  position: sticky; top: 0; z-index: 40; backdrop-filter: blur(10px);
  background: rgba(8,12,20,.9); border-bottom: 1px solid var(--border);
}
.header-top { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px 10px; gap: 16px; }
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-badge { display: grid; grid-template-columns: repeat(2, 10px); grid-auto-rows: 10px; gap: 4px; }
.logo-badge span:nth-child(1) { background: var(--accent); border-radius: 3px; }
.logo-badge span:nth-child(2) { background: var(--accent-2); border-radius: 3px; }
.logo-badge span:nth-child(3) { background: var(--accent-3); border-radius: 3px; }
.logo-badge span:nth-child(4) { background: var(--accent-4); border-radius: 3px; opacity: .8; }
.logo-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.logo-subtitle { color: var(--text-3); font-size: 12px; }
.header-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.meta-pill { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 24px 14px; }
.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filter-group-label { font-size: 11px; text-transform: uppercase; color: var(--text-3); letter-spacing: .08em; margin-right: 4px; }
.filter-chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  border-radius: 999px; padding: 7px 12px; cursor: pointer; transition: .15s ease;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: rgba(0,229,255,.08); border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 0; padding: 0 24px; border-top: 1px solid rgba(30,48,80,.4); overflow: auto; }
.tab {
  padding: 14px 18px; color: var(--text-3); border-bottom: 2px solid transparent; white-space: nowrap;
  cursor: pointer; font-weight: 600; transition: .15s ease;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.main { padding: 22px 24px 40px; max-width: 1600px; margin: 0 auto; }
.page-head { display: grid; grid-template-columns: 1.4fr .9fr; gap: 16px; margin-bottom: 18px; }
.page-intro, .page-summary, .section, .kpi-card, .drawer-card, .legend-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
}
.page-intro { padding: 18px 20px; }
.page-title { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
.page-text { margin: 0; color: var(--text-2); }
.summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 16px; }
.summary-item { padding: 12px; border: 1px solid rgba(30,48,80,.6); border-radius: 12px; background: var(--surface-2); }
.summary-label { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.summary-value { font-size: 14px; color: var(--text); font-weight: 700; }
.kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card { padding: 15px; position: relative; overflow: hidden; cursor: pointer; }
.kpi-card:before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); opacity: .9; }
.kpi-label { font-size: 11px; text-transform: uppercase; color: var(--text-3); letter-spacing: .08em; margin-bottom: 8px; }
.kpi-value { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.kpi-sub { color: var(--text-2); font-size: 12px; margin-top: 8px; }
.kpi-delta { margin-top: 6px; font-size: 12px; font-weight: 700; }
.kpi-delta.up { color: var(--accent-3); }
.kpi-delta.down { color: var(--accent-5); }
.section-grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
.section-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
.section { overflow: hidden; }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid rgba(30,48,80,.7); }
.section-title { font-size: 16px; font-weight: 800; margin: 0 0 4px; }
.section-subtitle { margin: 0; color: var(--text-3); font-size: 12px; }
.section-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn, .ghost-btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 10px; cursor: pointer; transition: .15s ease;
}
.icon-btn { width: 34px; height: 34px; }
.ghost-btn { padding: 8px 12px; font-size: 12px; }
.icon-btn:hover, .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
.section-body { padding: 18px; }
.pitch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.pitch-card { background: var(--surface-2); border: 1px solid rgba(30,48,80,.65); border-radius: 12px; padding: 12px; }
.pitch-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.pitch-text { color: var(--text-2); font-size: 13px; }
.alert {
  background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.25); border-radius: 12px; padding: 12px 14px; color: var(--text-2);
  margin-bottom: 16px;
}
.alert.warning { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.24); }
.alert.danger { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.24); }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel-step { display: grid; grid-template-columns: 220px 1fr 76px 84px; gap: 12px; align-items: center; cursor: pointer; }
.funnel-name { color: var(--text-2); font-size: 13px; }
.bar-track { position: relative; height: 34px; background: var(--surface-2); border-radius: 10px; overflow: hidden; border: 1px solid rgba(30,48,80,.5); }
.bar-fill { height: 100%; border-radius: 10px; display: flex; align-items: center; padding: 0 10px; white-space: nowrap; font-size: 12px; font-weight: 700; color: rgba(8,12,20,.88); }
.bar-value, .bar-side { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; text-align: right; }
.bar-side { color: var(--text-3); }
.legend-row { display: flex; gap: 10px; flex-wrap: wrap; }
.legend-chip { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface-2); border: 1px solid rgba(30,48,80,.6); border-radius: 999px; color: var(--text-2); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.table-wrap { overflow: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 12px; border-bottom: 1px solid rgba(30,48,80,.45); font-size: 13px; }
.table th { text-align: left; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; position: sticky; top: 0; background: var(--surface); }
.table tr:hover td { background: rgba(255,255,255,.02); }
.table tr.clickable { cursor: pointer; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.good { color: var(--accent-3); }
.warn { color: var(--accent-4); }
.bad { color: var(--accent-5); }
.accent { color: var(--accent); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 700; }
.badge.good { background: rgba(16,185,129,.12); }
.badge.warn { background: rgba(245,158,11,.12); }
.badge.bad { background: rgba(239,68,68,.12); }
.badge.accent { background: rgba(0,229,255,.12); }
.meter { min-width: 120px; display: flex; align-items: center; gap: 8px; }
.meter-track { width: 110px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid rgba(30,48,80,.4); }
.meter-fill { height: 100%; border-radius: 999px; }
.chart-card { background: var(--surface-2); border: 1px solid rgba(30,48,80,.6); border-radius: 14px; padding: 14px; }
.chart-title { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.line-chart svg, .heatmap svg { width: 100%; height: auto; display: block; }
.flow-list { display: flex; flex-direction: column; gap: 10px; }
.flow-row { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; }
.flow-source { color: var(--text-2); font-size: 13px; }
.flow-stack { display: flex; height: 24px; border-radius: 999px; overflow: hidden; border: 1px solid rgba(30,48,80,.5); background: var(--surface-2); }
.flow-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: rgba(8,12,20,.85); }
.heatmap { display: grid; gap: 6px; }
.heatmap-row { display: grid; grid-template-columns: 92px repeat(4, 1fr); gap: 6px; }
.heatmap-head { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; text-align: center; }
.heatmap-label { color: var(--text-2); font-size: 12px; display: flex; align-items: center; }
.heatmap-cell { min-height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.small-note { color: var(--text-3); font-size: 12px; }
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(3,7,12,.62); z-index: 90;
}
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 96vw); background: #09111c; z-index: 91;
  border-left: 1px solid var(--border); box-shadow: var(--shadow); overflow: auto;
}
.drawer-head { position: sticky; top: 0; background: rgba(9,17,28,.95); backdrop-filter: blur(10px); z-index: 2; padding: 18px 20px; border-bottom: 1px solid rgba(30,48,80,.7); display: flex; justify-content: space-between; gap: 12px; }
.drawer-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
.drawer-subtitle { margin: 0; color: var(--text-3); }
.drawer-body { padding: 18px 20px 28px; }
.drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.drawer-card { padding: 12px; }
.drawer-card h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
.drawer-card p, .drawer-card li { color: var(--text-2); font-size: 13px; }
.drawer-card ul { margin: 0; padding-left: 18px; }
.formula { background: var(--surface-2); border: 1px solid rgba(30,48,80,.6); border-radius: 12px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-bottom: 14px; color: var(--accent); }
.empty { padding: 28px; text-align: center; color: var(--text-3); }
.pills-row { display: flex; gap: 8px; flex-wrap: wrap; }
.select { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; }
.footer-note { margin-top: 10px; font-size: 12px; color: var(--text-3); }
@media (max-width: 1200px) {
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  .page-head, .section-grid-2, .section-grid-3, .pitch-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .funnel-step { grid-template-columns: 1fr; }
  .heatmap-row { grid-template-columns: 78px repeat(4, 1fr); }
}
@media (max-width: 700px) {
  .header-top, .filter-bar, .tabs, .main { padding-left: 16px; padding-right: 16px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .summary-grid, .drawer-grid { grid-template-columns: 1fr; }
}
</style>
</head>

  function pct(value) { return round(value).toFixed(1) + '%'; }
  function mergeProfile(filters) {
    const p = { engagement:1, reg:1, dep:1, bet:1, bonus:1, store:1, discovery:1, payment:1, friction:1, kyc:1, retention:1, error:1 };
    ['project','period','device','geo','lifecycle'].forEach(key => {
      const effect = PROFILE_EFFECTS[key][filters[key]];
      Object.keys(p).forEach(metric => { p[metric] *= effect[metric]; });
    });
    return p;
  }
  function adjust(value, factor, min=0, max=100) { return round(clamp(value * factor, min, max)); }
  function invert(value, factor, min=0, max=100) { return round(clamp(value * (2 - factor), min, max)); }
  function deriveData(filters) {
    const prof = mergeProfile(filters);
    const core = BASE.coreFunnel.map(item => ({ ...item }));
    core[1].value = adjust(BASE.coreFunnel[1].value, prof.engagement, 20, 95);
    core[2].value = Math.min(core[1].value - 2, adjust(BASE.coreFunnel[2].value, prof.reg, 8, 70));
    core[3].value = Math.min(core[2].value - 1.5, adjust(BASE.coreFunnel[3].value, prof.reg * (2 - (prof.friction - 0.9)), 5, 60));
    core[4].value = Math.min(core[3].value - 1, adjust(BASE.coreFunnel[4].value, prof.dep, 3, 45));
    core[5].value = Math.min(core[4].value - 0.3, adjust(BASE.coreFunnel[5].value, prof.payment, 2, 40));
    core[6].value = Math.min(core[5].value - 0.2, adjust(BASE.coreFunnel[6].value, prof.dep * prof.payment, 1, 35));
    core[7].value = Math.min(core[6].value, adjust(BASE.coreFunnel[7].value, prof.bet, 1, 32));
    core[8].value = Math.min(core[7].value - 0.2, adjust(BASE.coreFunnel[8].value, prof.bet * prof.retention, 0.5, 28));
    core.forEach(item => item.value = round(item.value));

    const trend = BASE.trend.map((row, idx) => {
      const periodBias = filters.period === '7 дней' ? (idx % 2 === 0 ? -0.4 : 0.6) : filters.period === '90 дней' ? ((idx - 3) * 0.15) : ((idx - 3) * 0.05);
      return {
        date: row.date,
        engagement: adjust(row.engagement + periodBias, prof.engagement, 30, 95),
        reg: adjust(row.reg + periodBias * 0.7, prof.reg, 15, 70),
        dep: adjust(row.dep + periodBias * 0.15, prof.dep * prof.payment, 2, 20),
        bet: adjust(row.bet + periodBias * 0.1, prof.bet * prof.retention, 1, 16)
      };
    });

    const interactions = BASE.interactions.map(item => ({
      ...item,
      share: adjust(item.share, prof.discovery * prof.engagement, 1, 60),
      dep: adjust(item.dep, prof.dep * (item.name.includes('депозита') ? 1.06 : 1), 1, 40),
      bet: adjust(item.bet, prof.bet * (item.name.includes('Карточка игры') ? 1.05 : 1), 1, 35)
    }));

    const ux = BASE.ux.map(item => ({
      ...item,
      impression: adjust(item.impression, prof.engagement, 5, 100),
      ctr: adjust(item.ctr, prof.discovery * (item.zone === 'Главная' ? 1.02 : 1), 0.5, 60),
      close: invert(item.close, prof.engagement, 5, 90),
      dep: adjust(item.dep, prof.dep * (item.tag === 'hidden' ? 1.05 : 1), 0.5, 30),
      reg: adjust(item.reg, prof.reg, 0.5, 35)
    }));

    const regFunnel = BASE.regFunnel.map(item => ({ ...item }));
    regFunnel[1].value = adjust(BASE.regFunnel[1].value, prof.reg, 20, 95);
    regFunnel[2].value = Math.min(regFunnel[1].value - 2, adjust(BASE.regFunnel[2].value, prof.reg * (2 - (prof.friction - 0.9)), 15, 90));
    regFunnel[3].value = Math.min(regFunnel[2].value - 2, adjust(BASE.regFunnel[3].value, prof.reg * (2 - (prof.friction - 0.9)), 10, 85));
    regFunnel[4].value = Math.min(regFunnel[3].value - 1, adjust(BASE.regFunnel[4].value, prof.reg, 8, 75));
    regFunnel[5].value = Math.min(regFunnel[4].value - 0.5, adjust(BASE.regFunnel[5].value, prof.reg, 6, 70));

    const regEntry = BASE.regEntry.map(item => ({
      ...item,
      regStart: adjust(item.regStart, prof.reg, 60, 150),
      regComplete: adjust(item.regComplete, prof.reg * (2 - (prof.friction - 0.9)), 10, 80),
      depAfter: adjust(item.depAfter, prof.dep, 2, 35)
    }));

    const fieldFriction = BASE.fieldFriction.map(item => ({
      ...item,
      drop: adjust(item.drop, prof.friction, 2, 60),
      error: adjust(item.error, prof.friction * prof.error, 5, 80)
    }));

    const kyc = BASE.kyc.map(item => ({ ...item }));
    kyc[1].value = adjust(BASE.kyc[1].value, prof.kyc, 25, 95);
    kyc[2].value = Math.min(kyc[1].value - 2, adjust(BASE.kyc[2].value, prof.kyc, 15, 90));
    kyc[3].value = Math.min(kyc[2].value - 2, adjust(BASE.kyc[3].value, prof.kyc * (2 - (prof.friction - 0.9)), 8, 80));

    const bonus = BASE.bonus.map(item => ({
      ...item,
      page: adjust(item.page, prof.bonus, 10, 100),
      card: adjust(item.card, prof.bonus, 5, 90),
      terms: adjust(item.terms, prof.bonus, 2, 70),
      apply: adjust(item.apply, prof.bonus * (2 - (prof.friction - 0.9)), 2, 75),
      blocked: invert(item.blocked, prof.bonus * prof.payment, 1, 60),
      depAfter: adjust(item.depAfter, prof.dep, 1, 40),
      depSuccess: adjust(item.depSuccess, prof.dep * prof.payment, 1, 35)
    }));

    const storeFunnel = BASE.storeFunnel.map(item => ({ ...item }));
    storeFunnel[1].value = adjust(BASE.storeFunnel[1].value, prof.store, 20, 95);
    storeFunnel[2].value = Math.min(storeFunnel[1].value - 2, adjust(BASE.storeFunnel[2].value, prof.store, 10, 85));
    storeFunnel[3].value = Math.min(storeFunnel[2].value - 2, adjust(BASE.storeFunnel[3].value, prof.store * (2 - (prof.friction - 0.9)), 8, 80));
    storeFunnel[4].value = Math.min(storeFunnel[3].value - 2, adjust(BASE.storeFunnel[4].value, prof.store, 4, 70));
    storeFunnel[5].value = Math.min(storeFunnel[4].value - 2, adjust(BASE.storeFunnel[5].value, prof.store * prof.payment, 2, 55));

    const storeEntry = BASE.storeEntry.map(item => ({ ...item, value: adjust(item.value, prof.store * prof.bonus, 1, 60) }));

    const discovery = BASE.discovery.map(item => ({
      ...item,
      impression: adjust(item.impression, prof.discovery, 5, 100),
      click: adjust(item.click, prof.discovery, 1, 60),
      gameOpen: adjust(item.gameOpen, prof.discovery * prof.bet, 1, 50),
      demo: adjust(item.demo, prof.discovery, 0.5, 30),
      real: adjust(item.real, prof.bet, 0.5, 40),
      firstBet: adjust(item.firstBet, prof.bet * prof.retention, 0.5, 35),
      return: invert(item.return, prof.discovery * prof.retention, 5, 80)
    }));

    const depositFunnel = BASE.depositFunnel.map(item => ({ ...item }));
    depositFunnel[1].value = adjust(BASE.depositFunnel[1].value, prof.payment, 50, 100);
    depositFunnel[2].value = Math.min(depositFunnel[1].value - 1, adjust(BASE.depositFunnel[2].value, prof.payment, 20, 98));
    depositFunnel[3].value = Math.min(depositFunnel[2].value - 1, adjust(BASE.depositFunnel[3].value, prof.bonus, 10, 95));
    depositFunnel[4].value = Math.min(depositFunnel[3].value - 1, adjust(BASE.depositFunnel[4].value, prof.payment * (2 - (prof.friction - 0.9)), 8, 92));
    depositFunnel[5].value = Math.min(depositFunnel[4].value - 1, adjust(BASE.depositFunnel[5].value, prof.payment, 5, 88));
    depositFunnel[6].value = Math.min(depositFunnel[5].value - 1, adjust(BASE.depositFunnel[6].value, prof.dep * prof.payment, 2, 75));

    const methods = BASE.methods.map(item => ({
      ...item,
      success: adjust(item.success, prof.payment, 20, 95),
      fail: adjust(item.fail, prof.error, 2, 60),
      abandon: adjust(item.abandon, prof.friction, 2, 60),
      retry: adjust(item.retry, prof.retention, 5, 90)
    }));

    const errors = BASE.errors.map(item => ({
      ...item,
      freq: adjust(item.freq, prof.error, 1, 80),
      impact: adjust(item.impact, prof.error * (filters.device === 'Мобайл' ? 1.04 : 1), 1, 80)
    }));

    const heatmap = {
      cols: BASE.heatmap.cols.slice(),
      rows: BASE.heatmap.rows.slice(),
      values: BASE.heatmap.values.map(row => row.map(v => adjust(v, prof.payment, 10, 98)))
    };

    return { prof, core, trend, interactions, ux, regFunnel, regEntry, fieldFriction, kyc, bonus, storeFunnel, storeEntry, discovery, depositFunnel, methods, errors, heatmap };
  }

  function registerDrawer(payload) {
    const id = 'dr-' + (++drawerSeq);
    drawerRegistry[id] = payload;
    return id;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function drawerAttrs(payload) {
    const id = registerDrawer(payload);
    return 'data-action="open-drawer" data-drawer-id="' + id + '"';
  }

  function pill(text, active, action, value) {
    return '<button class="filter-chip' + (active ? ' active' : '') + '" data-action="' + action + '" data-value="' + escapeHtml(value) + '">' + escapeHtml(text) + '</button>';
  }

  function sectionPitch(meta) {
    return '<div class="pitch-grid">'
      + '<div class="pitch-card"><div class="pitch-label">Что измеряем</div><div class="pitch-text">' + escapeHtml(meta.measure) + '</div></div>'
      + '<div class="pitch-card"><div class="pitch-label">Актуальность для продакта</div><div class="pitch-text">' + escapeHtml(meta.why) + '</div></div>'
      + '<div class="pitch-card"><div class="pitch-label">Какие решения поддерживает</div><div class="pitch-text">' + escapeHtml(meta.decisions) + '</div></div>'
      + '</div>';
  }

  function kpiCard({ label, value, sub, delta, color, metricKey }) {
    const def = DEFINITIONS[metricKey] || null;
    const drawer = def ? {
      title: def.title,
      subtitle: 'Описание метрики',
      formula: def.formula,
      definition: def.definition,
      relevance: def.relevance,
      success: def.success,
      decisions: def.decisions,
      insights: def.insights,
      hypotheses: def.hypotheses
    } : null;
    return '<div class="kpi-card" ' + (drawer ? drawerAttrs(drawer) : '') + '>'
      + '<div class="kpi-label">' + escapeHtml(label) + '</div>'
      + '<div class="kpi-value" style="color:' + color + '">' + escapeHtml(value) + '</div>'
      + '<div class="kpi-delta ' + (delta >= 0 ? 'up' : 'down') + '">' + (delta >= 0 ? '▲ +' : '▼ ') + Math.abs(delta).toFixed(1) + ' п.п.</div>'
      + '<div class="kpi-sub">' + escapeHtml(sub) + '</div>'
      + '</div>';
  }

  function summaryGrid(items) {
    return '<div class="page-summary"><div class="summary-grid">' + items.map(item => '<div class="summary-item"><div class="summary-label">' + escapeHtml(item[0]) + '</div><div class="summary-value">' + escapeHtml(item[1]) + '</div></div>').join('') + '</div></div>';
  }

  function pageHead(pageKey) {
    const meta = PAGE_META[pageKey];
    return '<div class="page-head">'
      + '<div class="page-intro"><h1 class="page-title">' + escapeHtml(meta.title) + '</h1><p class="page-text">' + escapeHtml(meta.text) + '</p></div>'
      + summaryGrid(meta.summary)
      + '</div>';
  }

  function buildDrawerContent(payload) {
    if (!payload) return '';
    const insights = payload.insights || [];
    const hypotheses = payload.hypotheses || [];
    const decisions = payload.decisions || [];
    return '<div class="drawer-backdrop" data-action="close-drawer"></div>'
      + '<aside class="drawer">'
      + '<div class="drawer-head"><div><h2 class="drawer-title">' + escapeHtml(payload.title || 'Детали') + '</h2><p class="drawer-subtitle">' + escapeHtml(payload.subtitle || '') + '</p></div><button class="icon-btn" data-action="close-drawer">×</button></div>'
      + '<div class="drawer-body">'
      + (payload.formula ? '<div class="formula">' + escapeHtml(payload.formula) + '</div>' : '')
      + '<div class="drawer-grid">'
      + (payload.definition ? '<div class="drawer-card"><h4>Что это</h4><p>' + escapeHtml(payload.definition) + '</p></div>' : '')
      + (payload.relevance ? '<div class="drawer-card"><h4>Актуальность для продакта</h4><p>' + escapeHtml(payload.relevance) + '</p></div>' : '')
      + (payload.success ? '<div class="drawer-card"><h4>Что даёт бизнесу</h4><p>' + escapeHtml(payload.success) + '</p></div>' : '')
      + (decisions.length ? '<div class="drawer-card"><h4>Какие решения поддерживает</h4><ul>' + decisions.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div>' : '')
      + '</div>'
      + (insights.length ? '<div class="drawer-card" style="margin-bottom:12px;"><h4>Инсайты</h4><ul>' + insights.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div>' : '')
      + (hypotheses.length ? '<div class="drawer-card"><h4>Продуктовые гипотезы</h4><ul>' + hypotheses.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div>' : '')
      + '</div></aside>';
  }

  function renderLineChart(data, key, color) {
    const width = 640, height = 210, left = 28, right = 10, top = 10, bottom = 26;
    const max = Math.max(...data.map(x => x[key])) * 1.1;
    const min = Math.min(...data.map(x => x[key])) * 0.9;
    const innerW = width - left - right;
    const innerH = height - top - bottom;
    const points = data.map((item, index) => {
      const x = left + (innerW * index / Math.max(1, data.length - 1));
      const y = top + innerH - ((item[key] - min) / Math.max(1, max - min)) * innerH;
      return [round(x), round(y), item];
    });
    const poly = points.map(p => p[0] + ',' + p[1]).join(' ');
    let circles = points.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + color + '"></circle>').join('');
    let xLabels = points.map(p => '<text x="' + p[0] + '" y="' + (height - 6) + '" text-anchor="middle" font-size="10" fill="#6482a7">' + escapeHtml(p[2].date) + '</text>').join('');
    const yTicks = [0, .25, .5, .75, 1].map(t => {
      const y = top + innerH - innerH * t;
      const val = round(min + (max - min) * t);
      return '<line x1="' + left + '" x2="' + (width-right) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(30,48,80,.45)" stroke-dasharray="4 4"></line>'
        + '<text x="8" y="' + (y + 4) + '" font-size="10" fill="#6482a7">' + val.toFixed(1) + '%</text>';
    }).join('');
    return '<div class="chart-card line-chart"><div class="chart-title">Динамика метрики по периоду</div><svg viewBox="0 0 ' + width + ' ' + height + '">' + yTicks + '<polyline fill="none" stroke="' + color + '" stroke-width="3" points="' + poly + '"></polyline>' + circles + xLabels + '</svg></div>';
  }

  function renderFunnel(steps, drawerFactory) {
    return '<div class="funnel">' + steps.map((step, index) => {
      const prev = index === 0 ? 100 : steps[index - 1].value;
      const stepCr = index === 0 ? 100 : round(step.value / prev * 100);
      const drawer = drawerFactory(step, index, stepCr);
      return '<div class="funnel-step" ' + drawerAttrs(drawer) + '>'
        + '<div class="funnel-name">' + escapeHtml(step.name) + '</div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:' + step.value + '%;background:' + step.color + '">' + pct(step.value) + '</div></div>'
        + '<div class="bar-value">' + pct(step.value) + '</div>'
        + '<div class="bar-side">' + pct(stepCr) + ' шаг</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function meter(value, max, color) {
    return '<div class="meter"><div class="meter-track"><div class="meter-fill" style="width:' + Math.min(100, value / max * 100) + '%;background:' + color + '"></div></div><span class="mono">' + pct(value) + '</span></div>';
  }

  function tagBadge(tag) {
    if (tag === 'champion') return '<span class="badge good">сильный блок</span>';
    if (tag === 'hidden') return '<span class="badge accent">скрытый чемпион</span>';
    if (tag === 'trap') return '<span class="badge warn">ловушка внимания</span>';
    return '<span class="badge">нейтрально</span>';
  }

  function renderFlow(rows) {
    return '<div class="chart-card"><div class="chart-title">Куда пользователь идёт дальше</div><div class="flow-list">' + rows.map(row => '<div class="flow-row"><div class="flow-source">' + escapeHtml(row.from) + '</div><div class="flow-stack">' + row.parts.map(part => '<div class="flow-seg" style="width:' + part.value + '%;background:' + part.color + '">' + (part.value >= 9 ? part.value + '%' : '') + '</div>').join('') + '</div></div>').join('') + '</div><div class="footer-note">Логика потока нужна продукту, чтобы не терять контекст после ключевого шага. Это уже не просто воронка, а сценарий следующего действия.</div></div>';
  }

  function renderHeatmap(heatmap) {
    const flat = heatmap.values.flat();
    const min = Math.min(...flat), max = Math.max(...flat);
    function cellColor(value) {
      const t = (value - min) / Math.max(1, max - min);
      const r = Math.round(239 * (1 - t) + 16 * t);
      const g = Math.round(68 * (1 - t) + 185 * t);
      const b = Math.round(68 * (1 - t) + 129 * t);
      return 'rgba(' + r + ',' + g + ',' + b + ',.78)';
    }
    let html = '<div class="chart-card"><div class="chart-title">Матрица успеха по устройству и методу</div><div class="heatmap">';
    html += '<div class="heatmap-row"><div></div>' + heatmap.cols.map(c => '<div class="heatmap-head">' + escapeHtml(c) + '</div>').join('') + '</div>';
    heatmap.rows.forEach((row, ri) => {
      html += '<div class="heatmap-row"><div class="heatmap-label">' + escapeHtml(row) + '</div>';
      heatmap.values[ri].forEach(value => { html += '<div class="heatmap-cell" style="background:' + cellColor(value) + '">' + pct(value) + '</div>'; });
      html += '</div>';
    });
    html += '</div><div class="footer-note">Зачем блок нужен в ТЗ: он продаёт идею, что одна и та же платёжка может выглядеть нормально в среднем и разваливаться на отдельном устройстве.</div></div>';
    return html;
  }

  function interactionDrawer(item) {
    return {
      title: item.name,
      subtitle: 'Анализ первой значимой точки входа',
      formula: 'Депозит после взаимодействия = Пользователи с депозитом после взаимодействия / Пользователи с таким первым взаимодействием × 100',
      definition: 'Первое значимое действие пользователя в сессии и его последующий эффект на депозит и первую ставку.',
      relevance: 'Это метрика «качественного входа» в продукт. Она помогает понять, какие точки входа на самом деле приближают пользователя к деньгам.',
      success: 'Даёт продакту аргумент, почему усиливать нужно не самый кликабельный, а самый денежный блок.',
      decisions: ['Менять порядок блоков на главной', 'Усиливать точки входа с сильным выходом в деньги', 'Снижать вес шумных элементов без продуктовой ценности'],
      insights: [
        'Доля сессий с этим первым действием: ' + pct(item.share) + '.',
        'После него до депозита доходят ' + pct(item.dep) + ', а до первой ставки — ' + pct(item.bet) + '.',
        item.dep > 12 ? 'Эта точка входа сильнее среднего по выходу в деньги и заслуживает большей видимости.' : 'Эта точка входа не даёт сильного выхода в деньги и требует переосмысления призыва к действию или сценария.'
      ],
      hypotheses: item.dep > 12
        ? ['Сделать эту точку входа выше на главной и проверить прирост вовлечения.', 'Добавить рядом более явный аргумент ценности, чтобы усилить и без того хороший денежный сигнал.']
        : ['Проверить, не является ли блок ловушкой внимания: интерес есть, а выхода в деньги нет.', 'Изменить текст и следующий шаг после клика, чтобы он вёл к более сильному сценарию.']
    };
  }

  function renderCorePage(data) {
    const core = data.core;
    const engaged = core.find(x => x.id === 'engaged').value;
    const regComplete = core.find(x => x.id === 'regComplete').value;
    const depSuccess = core.find(x => x.id === 'depSuccess').value;
    const gameStart = core.find(x => x.id === 'gameStart').value;
    const firstBet = core.find(x => x.id === 'firstBet').value;
    const regToDep = round(depSuccess / Math.max(regComplete, 1) * 100);
    const trendColorMap = { engagement: COLORS.cyan, reg: COLORS.purple, dep: COLORS.green, bet: COLORS.orange };
    const trendKeyName = { engagement: 'Вовлечённость', reg: 'Регистрация', dep: 'Депозит', bet: 'Первая ставка' };
    const page = [];
    page.push(pageHead('core'));
    page.push('<div class="alert">Этот экран должен быть первым в любом разборе, потому что он позволяет за пять минут понять, где именно продукт теряет пользователя: в интересе, в регистрации, в платёжном намерении или уже на пути к первой ценности.</div>');
    page.push('<div class="kpi-grid">'
      + kpiCard({ label: 'Вовлечённый визит', value: pct(engaged), sub: 'от всех визитов', delta: 1.8, color: COLORS.cyan, metricKey: 'engagement' })
      + kpiCard({ label: 'Регистрация завершена', value: pct(regComplete), sub: 'от вовлечённых', delta: -0.4, color: COLORS.purple, metricKey: 'reg' })
      + kpiCard({ label: 'Депозит успешен', value: pct(depSuccess), sub: 'от вовлечённых', delta: 0.3, color: COLORS.green, metricKey: 'dep' })

  function renderDepositPage(data) {
    const success = data.depositFunnel[data.depositFunnel.length - 1].value;
    const abandon = round(data.methods.reduce((s,x)=>s+x.abandon,0)/data.methods.length);
    const fail = round(data.methods.reduce((s,x)=>s+x.fail,0)/data.methods.length);
    const retry = round(data.methods.reduce((s,x)=>s+x.retry,0)/data.methods.length);
    const retrySuccess = adjust(58.4, data.prof.retention * data.prof.payment, 10, 95);
    const page = [];
    page.push(pageHead('deposit'));
    page.push('<div class="alert danger">Этот экран продаёт в ТЗ самую дорогую идею: мы теряем уже прогретое намерение. Поэтому блок должен объяснять не просто ошибки, а стоимость каждой точки потери для продукта.</div>');
    page.push('<div class="kpi-grid">'
      + kpiCard({ label: 'Успех депозита', value: pct(success), sub: 'от открытия депозитного слоя', delta: 1.2, color: COLORS.green, metricKey: 'payment' })
      + kpiCard({ label: 'Доля ухода', value: pct(abandon), sub: 'средний уход без завершения', delta: -0.8, color: COLORS.orange, metricKey: 'payment' })
      + kpiCard({ label: 'Доля ошибок', value: pct(fail), sub: 'ошибки после подтверждения', delta: 0.4, color: COLORS.red, metricKey: 'payment' })
      + kpiCard({ label: 'Повторная попытка', value: pct(retry), sub: 'повторная попытка после ошибки', delta: 1.8, color: COLORS.cyan, metricKey: 'payment' })
      + kpiCard({ label: 'Успех после повтора', value: pct(retrySuccess), sub: 'резерв роста после неудачи', delta: 2.1, color: COLORS.purple, metricKey: 'payment' })
      + '</div>');

    page.push('<div class="section-grid-2">');
    page.push('<section class="section"><div class="section-head"><div><h3 class="section-title">Воронка депозитного UX</h3><p class="section-subtitle">Нужно понимать, где пропадает уже сформированное намерение заплатить.</p></div></div><div class="section-body">'
      + sectionPitch({ measure: 'Шаги внутри депозитного слоя от открытия до успешного зачисления.', why: 'Даёт прозрачную карту потерь на последней миле монетизации.', decisions: 'Помогает выбирать, что менять первым: методы, форму, бонус, копирайт, провайдера.' })
      + renderFunnel(data.depositFunnel, (step, index, stepCr) => ({
        title: step.name,
        subtitle: 'Шаг депозитной воронки',
        formula: step.name + ' / открытие депозита × 100',
        definition: 'Сквозная доля пользователей, дошедших до шага «' + step.name + '».',
        relevance: 'Это главный инструмент диагностики потерь между намерением заплатить и реальным зачислением.',
        success: 'Позволяет приоритизировать изменения, которые дают прямой эффект на выручку.',
        decisions: ['Переставить методы', 'Сократить форму', 'Поменять бонус по умолчанию', 'Изменить сценарий после ошибки'],
        insights: ['Сквозная доля шага: ' + pct(step.value) + '.', 'Конверсия из предыдущего шага: ' + pct(stepCr) + '.'],
        hypotheses: ['Если падение на выборе метода — проблема в покрытии и приоритизации.', 'Если падение на подтверждении или успешном зачислении — нужно смотреть ошибки и провайдеров.']
      }))
      + '</div></section>');

    page.push('<section class="section"><div class="section-head"><div><h3 class="section-title">Методы оплаты</h3><p class="section-subtitle">Блок нужен, чтобы сортировать методы по реальной проблемности, а не по интуиции.</p></div></div><div class="section-body">'
      + sectionPitch({ measure: 'Успех, ошибки, уход и повтор по каждому методу.', why: 'Позволяет сразу увидеть, какой метод реально душит монетизацию.', decisions: 'Помогает приоритизировать работу с провайдером и порядок методов в форме.' })
      + '<div class="table-wrap"><table class="table"><thead><tr><th>Метод</th><th>Успех</th><th>Ошибки</th><th>Уход</th><th>Повтор</th><th>Главная ошибка</th></tr></thead><tbody>'
      + data.methods.map(item => '<tr class="clickable" ' + drawerAttrs({
          title: item.method,
          subtitle: 'Разбор платёжного метода',
          formula: 'Успех = Успешные депозиты / Попытки подтверждения × 100',
          definition: 'Показывает качество конкретного платёжного метода в реальном пользовательском потоке.',
          relevance: 'Нужен продакту, чтобы расставлять методы в правильном порядке и не чинить не то.',
          success: 'Даёт ответ, какой метод лечить первым и где есть резерв роста через повтор или резервный сценарий.',
          decisions: ['Менять порядок методов', 'Подключать резервного провайдера', 'Показывать альтернативу после ошибки', 'Менять текст ошибок и доверительные элементы'],
          insights: ['Успех: ' + pct(item.success) + '.', 'Ошибки: ' + pct(item.fail) + '.', 'Уход: ' + pct(item.abandon) + '.', 'Повтор: ' + pct(item.retry) + '.', 'Топ-ошибка: ' + item.errorTop + '.'],
          hypotheses: item.success < 65 ? ['Метод даёт слишком много технических потерь и должен быть ниже в списке.', 'После ошибки нужен явный перевод на альтернативный метод.'] : ['Метод стабилен и может быть вынесен выше как метод по умолчанию.', 'Стоит усиливать видимость этого метода в соответствующем гео.']
      }) + '><td>' + escapeHtml(item.method) + '</td><td>' + meter(item.success, 100, item.success > 75 ? COLORS.green : item.success > 60 ? COLORS.orange : COLORS.red) + '</td><td class="mono bad">' + pct(item.fail) + '</td><td class="mono warn">' + pct(item.abandon) + '</td><td class="mono">' + pct(item.retry) + '</td><td>' + escapeHtml(item.errorTop) + '</td></tr>').join('')
      + '</tbody></table></div></div></section>');
    page.push('</div>');

    page.push('<div class="section-grid-2">');
    page.push('<section class="section"><div class="section-head"><div><h3 class="section-title">Ошибки и их влияние</h3><p class="section-subtitle">Частота и влияние — разные вещи. Блок нужен, чтобы чинить то, что дороже всего.</p></div></div><div class="section-body">'
      + sectionPitch({ measure: 'Частота ошибки и её вклад в потерю конверсии.', why: 'Помогает не путать громкие ошибки с самыми дорогими для продукта.', decisions: 'Даёт основу для очереди исправлений у продукта и платёжной команды.' })
      + '<div class="table-wrap"><table class="table"><thead><tr><th>Тип ошибки</th><th>Частота</th><th>Влияние на конверсию</th></tr></thead><tbody>'
      + data.errors.map(item => '<tr><td>' + escapeHtml(item.type) + '</td><td>' + meter(item.freq, 40, COLORS.orange) + '</td><td>' + meter(item.impact, 35, COLORS.red) + '</td></tr>').join('')
      + '</tbody></table></div></div></section>');

    page.push('<section class="section"><div class="section-head"><div><h3 class="section-title">Разрез устройство × метод</h3><p class="section-subtitle">Средняя температура скрывает реальную проблему. Этот блок нужен для локализации провалов.</p></div></div><div class="section-body">'
      + sectionPitch({ measure: 'Успех метода по каждому устройству.', why: 'Позволяет увидеть, что конкретная платёжка может ломаться только на мобильном или только на iOS.', decisions: 'Даёт основу для приоритета починки и адресного резервного сценария.' })
      + renderHeatmap(data.heatmap)
      + '</div></section>');
    page.push('</div>');

    page.push('<section class="section"><div class="section-head"><div><h3 class="section-title">Путь после неуспешного депозита</h3><p class="section-subtitle">Блок нужен, чтобы видеть резерв роста после ошибки, а не считать потерю безвозвратной.</p></div></div><div class="section-body">'
      + sectionPitch({ measure: 'Что делает пользователь после ошибки депозита.', why: 'Повторная попытка — это зона быстрого роста без покупки нового трафика.', decisions: 'Помогает решить, нужен ли резервный сценарий, поддержка, смена метода или напоминание.' })
      + renderFlow([{ from: 'После ошибки', parts: [
        { value: 42, color: COLORS.cyan },
        { value: 24, color: COLORS.green },
        { value: 12, color: COLORS.orange },
        { value: 14, color: COLORS.purple },
        { value: 8, color: COLORS.red }
      ] }])
      + '<div class="legend-row" style="margin-top:12px;"><div class="legend-chip"><span class="dot" style="background:' + COLORS.cyan + '"></span> повторить тот же метод</div><div class="legend-chip"><span class="dot" style="background:' + COLORS.green + '"></span> сменить метод</div><div class="legend-chip"><span class="dot" style="background:' + COLORS.orange + '"></span> поддержка</div><div class="legend-chip"><span class="dot" style="background:' + COLORS.purple + '"></span> вернуться позже</div><div class="legend-chip"><span class="dot" style="background:' + COLORS.red + '"></span> выход</div></div>'
      + '</div></section>');
    return page.join('');
  }

  function renderCurrentPage(data) {
    if (state.page === 'core') return renderCorePage(data);
    if (state.page === 'ux') return renderUxPage(data);
    if (state.page === 'reg') return renderRegPage(data);
    if (state.page === 'bonus') return renderBonusPage(data);
    if (state.page === 'discovery') return renderDiscoveryPage(data);
    return renderDepositPage(data);
  }

  function render() {
    drawerRegistry = {};
    drawerSeq = 0;
    const data = deriveData(state.filters);
    const tabs = [
      ['core', 'Главная воронка'],
      ['ux', 'Продуктовые блоки'],
      ['reg', 'Регистрация и KYC'],
      ['bonus', 'Бонусы и магазин'],
      ['discovery', 'Игровой каталог'],
      ['deposit', 'Депозитный UX']
    ];

    app.innerHTML = '<div class="header">'
      + '<div class="header-top">'
      + '<div class="logo-wrap"><div class="logo-badge"><span></span><span></span><span></span><span></span></div><div><div class="logo-title">FL продуктовый BI-дашборд</div><div class="logo-subtitle">Все блоки переведены на язык продуктовой ценности и ТЗ</div></div></div>'
      + '<div class="header-meta"><div class="meta-pill">Проект: ' + escapeHtml(state.filters.project) + '</div><div class="meta-pill">Период: ' + escapeHtml(state.filters.period) + '</div><div class="meta-pill">Сегмент: ' + escapeHtml(state.filters.lifecycle) + '</div></div>'
      + '</div>'
      + '<div class="filter-bar">'
      + ['project','period','device','geo','lifecycle'].map(key => '<div class="filter-group"><span class="filter-group-label">' + ({project:'Проект',period:'Период',device:'Устройство',geo:'Гео',lifecycle:'Сегмент'})[key] + '</span>' + FILTER_OPTIONS[key].map(val => pill(val, state.filters[key] === val, 'set-filter-' + key, val)).join('') + '</div>').join('')
      + '<div class="filter-group"><button class="ghost-btn" data-action="reset-filters">Сбросить фильтры</button></div>'
      + '</div>'
      + '<div class="tabs">' + tabs.map(tab => '<div class="tab' + (state.page === tab[0] ? ' active' : '') + '" data-action="set-page" data-value="' + tab[0] + '">' + tab[1] + '</div>').join('') + '</div>'
      + '</div>'
      + '<main class="main">' + renderCurrentPage(data) + '</main>'
      + (state.drawer ? buildDrawerContent(state.drawer) : '');
  }

  document.addEventListener('click', function(event) {
    const el = event.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    const value = el.getAttribute('data-value');
    if (action === 'set-page') { state.page = value; state.drawer = null; render(); return; }
    if (action === 'set-trend') { state.trendMetric = value; render(); return; }
    if (action === 'set-ux-zone') { state.uxZone = value; render(); return; }
    if (action === 'set-discovery-sort') { state.discoverySort = value; render(); return; }
    if (action.startsWith('set-filter-')) {
      const key = action.replace('set-filter-', '');
      state.filters[key] = value;
      state.drawer = null;
      render();
      return;
    }
    if (action === 'reset-filters') {
      state.filters = JSON.parse(JSON.stringify(baseState.filters));
      state.drawer = null;
      render();
      return;
    }
    if (action === 'open-drawer') {
      const id = el.getAttribute('data-drawer-id');
      state.drawer = drawerRegistry[id] || null;
      render();
      return;
    }
    if (action === 'close-drawer') {
      state.drawer = null;
      render();
      return;
    }
  });

  render();
})();
</script>
</body>
</html>
